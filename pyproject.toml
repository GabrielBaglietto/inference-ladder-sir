[project]
name = "inferladder"
dynamic = ["version"]
description = "Climbing the inference ladder on a single mechanistic model"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Gabriel Baglietto" }]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/inferladder/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/inferladder"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "nbmake>=1.5",
    "nbstripout>=0.7",
    "pre-commit>=3.8",
    "pytest>=8.0",
    "ruff>=0.6",
]
notebooks = [
    "jupyterlab>=4.6.3",
    "nbconvert>=7.17.1",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
files = ["src"]
ignore_missing_imports = true
# No `python_version` pin: numpy's own stubs use 3.12+ syntax, so asking mypy to
# check against the declared 3.11 floor fails inside numpy before reaching our code.
# The floor is still enforced where it matters, by `requires-python`.
