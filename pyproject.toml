[project]
name = "inferladder"
version = "0.0.0"
description = "Climbing the inference ladder on a single mechanistic model"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Gabriel Baglietto" }]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inferladder"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "nbmake>=1.5",
    "nbstripout>=0.7",
    "pre-commit>=3.8",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
files = ["src"]
python_version = "3.11"
ignore_missing_imports = true
