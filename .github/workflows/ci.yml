name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies
        # Not --all-groups: the `notebooks` group carries JupyterLab, which CI never
        # needs. `dev` is installed by default and holds the lint/test/nbmake tooling.
        # `bayes` is explicit: notebook 05 imports `inference.bayes`, which imports PyMC
        # at module level, and without it the notebook smoke test fails and test_bayes.py
        # silently skips instead of running.
        run: uv sync --group bayes

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest

      - name: Notebook smoke test
        run: |
          if compgen -G "notebooks/*.ipynb" > /dev/null; then
            uv run pytest --nbmake notebooks/
          else
            echo "No notebooks yet; skipping."
          fi
        shell: bash
